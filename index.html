<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="description" content="Crayonbox: a tap-to-color coloring book for kids. No ads, no accounts, works offline." />
    <meta name="theme-color" content="#fff6e5" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Crayonbox</title>
  </head>
  <body>
    <div class="app">
      <header class="tools" aria-label="Tools">
        <img class="brand" src="/icons/icon.svg" alt="Crayonbox" width="56" height="56" />
        <button id="pages" class="tool" type="button" aria-label="Pick a page" title="Pick a page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" /><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" /></svg>
        </button>
        <button id="undo" class="tool" type="button" aria-label="Undo" title="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
        </button>
        <button id="clear" class="tool" type="button" aria-label="Clear page" title="Clear page" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="m5 6 1.2 14a2 2 0 0 0 2 1.8h7.6a2 2 0 0 0 2-1.8L19 6" /><path d="M10 11v6M14 11v6" /></svg>
        </button>
        <button id="save" class="tool" type="button" aria-label="Save picture" title="Save picture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /></svg>
        </button>
        <button id="print" class="tool" type="button" aria-label="Print" title="Print">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6" /><rect x="3" y="9" width="18" height="8" rx="2" /><rect x="7" y="14" width="10" height="7" rx="1" /></svg>
        </button>
      </header>
      <main class="stage">
        <div class="paper"><div id="art" class="art"></div></div>
      </main>
      <section class="box" aria-label="Crayons">
        <div id="crayons" class="crayons"></div>
      </section>
    </div>
    <dialog id="picker" class="picker" aria-label="Pick a page">
      <button class="tool close" type="button" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <div class="thumbs"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
